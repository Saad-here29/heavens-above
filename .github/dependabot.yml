version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" 
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
    open-pull-requests-limit: 5
    target-branch: "Assignment02_GithubActions"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "<your-github-username>"
    labels:
      - "dependencies"
      - "automated-update"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "Assignment02_GithubActions"
