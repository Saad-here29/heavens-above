name: Scheduled Maintenance Tasks

on:
  schedule:
    # Runs every day at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:  # allows manual trigger

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run maintenance script
        run: |
          echo "Starting daily maintenance..."
          mkdir -p reports
          echo "Maintenance completed successfully on $(date)" > reports/maintenance_log.txt
          echo "Report generated at $(date)"

      - name: Upload maintenance log
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-log
          path: reports/maintenance_log.txt
