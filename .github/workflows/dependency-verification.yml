name: Dependency Verification Workflow

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - Assignment02_GithubActions
  workflow_dispatch: {}

jobs:
  test-dependency-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
