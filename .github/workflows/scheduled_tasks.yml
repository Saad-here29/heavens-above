name: Scheduled Maintenance Tasks

on:
  schedule:
    # Runs every day at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:  # allows manual trigger if needed

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Run maintenance script
        run: |
          echo "Starting daily maintenance..."
          echo "Cleaning logs and generating report..."
          mkdir -p reports
          echo "Maintenance completed successfully on $(date)" > reports/maintenance_log.txt

      - name: Upload maintenance log as artifact
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: reports/maintenance_log.txt
