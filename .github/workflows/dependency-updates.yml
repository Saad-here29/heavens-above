name: Dependency Update Verification

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - Assignment02_GithubActions
  workflow_dispatch:

jobs:
  test-dependency-update:
    # run only when Dependabot opens the PR OR allow manual dispatch
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linter (optional)
        run: npm run lint || echo "Lint failed/warnings"

      - name: Post result comment (success)
        if: success() && github.actor == 'dependabot[bot]'
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Dependency PR checks passed. Tests: success.
